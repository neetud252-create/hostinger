<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1xBet Promo Code</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 48px;
      line-height: 1.65;
      background: #111;
      color: #e8e8e8;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .section {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }

    .label {
      display: inline-block;
      background: #f59e0b;
      color: #000;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 4px 12px;
      border-radius: 4px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .keywords {
      list-style: none;
      padding: 0;
    }

    .keywords li {
      font-size: 1.15rem;
      padding: 6px 0;
      border-bottom: 1px solid #2a2a2a;
      font-weight: 500;
    }

    .keywords li:last-child {
      border-bottom: none;
    }

    .thumb-wrap {
      margin-top: 12px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #333;
      display: inline-block;
    }

    .thumb-wrap img {
      display: block;
      max-width: 100%;
      height: auto;
      pointer-events: none;
    }

    .channel-name {
      margin-top: 10px;
      font-size: 1rem;
      color: #ccc;
    }

    .channel-name strong {
      color: #fff;
    }

    .steps {
      counter-reset: step;
      list-style: none;
      padding: 0;
    }

    .steps li {
      counter-increment: step;
      position: relative;
      padding: 12px 0 12px 48px;
      border-bottom: 1px solid #222;
      font-size: 1rem;
    }

    .steps li:last-child {
      border-bottom: none;
    }

    .steps li::before {
      content: counter(step);
      position: absolute;
      left: 0;
      top: 12px;
      width: 32px;
      height: 32px;
      background: #f59e0b;
      color: #000;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .val {
      display: inline-block;
      background: #f59e0b22;
      border: 1px solid #f59e0b66;
      color: #f59e0b;
      font-weight: 700;
      padding: 1px 8px;
      border-radius: 4px;
      font-family: "SF Mono", "Fira Code", monospace;
    }

    .meta {
      font-size: 0.8rem;
      color: #555;
      margin-top: 20px;
      text-align: center;
    }

    .warning {
      background: #7f1d1d44;
      border: 1px solid #dc262655;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 12px;
      font-size: 0.9rem;
      color: #fca5a5;
    }

    .must-like {
      display: inline-block;
      background: #dc2626;
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 4px;
      margin-left: 8px;
      text-transform: uppercase;
    }
  </style>
</head>

<body
  oncontextmenu="return false"
  onselectstart="return false"
  ondragstart="return false"
>
  <div id="content"></div>

  <script>
    document.addEventListener("copy", e => e.preventDefault());

    document.addEventListener("keydown", function (e) {
      const ctrl = navigator.platform.toUpperCase().includes("MAC")
        ? e.metaKey
        : e.ctrlKey;

      if (ctrl && ["c", "x", "a"].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
    });

    const CONFIG = {
      keywords: [
        "1xbet promo code"
      ],
      thumbnailUrl: "./thumb.png",
      channelName: "Apex Trader",
      videoDurationSeconds: 120,
      minWatchMinutes: 2,
      watchCount: 1,
      proofQuestion: "",
      videoTitle: ""
    };

    function render(c) {
      const fps = 60;
      const minWatchSeconds = c.minWatchMinutes * 60;
      const isShortVideo = c.videoDurationSeconds <= minWatchSeconds;

      const requiredWatchSeconds = isShortVideo
        ? c.videoDurationSeconds
        : minWatchSeconds;

      const frameThreshold = requiredWatchSeconds * fps * c.watchCount;

      const kwListHtml = c.keywords
        .map(k => `<li>${k}</li>`)
        .join("");

      const fmtTime = s =>
        `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

      let watchText;

      if (isShortVideo) {
        watchText = `Watch the <strong>entire video</strong> (${fmtTime(c.videoDurationSeconds)}).`;
      } else {
        watchText = `Watch the video for at least <strong>${c.minWatchMinutes} minutes</strong>.`;
      }

      let warningTime;

      if (isShortVideo) {
        warningTime = fmtTime(c.videoDurationSeconds);
      } else {
        warningTime = `${c.minWatchMinutes} minute${c.minWatchMinutes > 1 ? "s" : ""}`;
      }

      const steps = [];

      steps.push(
        `Search for one of the keywords above on <strong>YouTube</strong>.`
      );

      steps.push(
        `Find the video with the thumbnail shown above from <strong>${c.channelName}</strong> and click it.`
      );

      steps.push(
        `Right-click on the video player and enable <strong>"Stats for nerds"</strong> before pressing play.`
      );

      steps.push(
        `${watchText} Your "Stats for nerds" frame count must be over: <span class="val">${frameThreshold.toLocaleString()}</span>`
      );

      steps.push(
        `<strong> 👍 LIKE Video AFTER COMPLETE WATCH</strong> `
      );

      if (c.watchCount >= 2) {
        const frameTwice = requiredWatchSeconds * fps * 2;

        steps.push(
          `Rewatch by moving the timestamp back to the beginning. Total frame count must be over: <span class="val">${frameTwice.toLocaleString()}</span>`
        );
      }

      if (c.proofQuestion) {
        steps.push(
          `In the proof section, answer: <strong>"${c.proofQuestion}"</strong> — then upload screenshots as required.`
        );
      } else {
        steps.push(
          `Upload all required screenshots as proof.`
        );
      }

      const stepsHtml = steps
        .map(s => `<li>${s}</li>`)
        .join("");

      document.getElementById("content").innerHTML = `
        <div class="section">
          <span class="label">
            Search for one of these keywords on YouTube:
            <span class="must-like">
              MUST 👍 LIKE Video AFTER COMPLETE WATCH
            </span>
          </span>

          <ul class="keywords">${kwListHtml}</ul>
        </div>

        <div class="section">
          <span class="label">
            Look for this thumbnail in the search results:
            <span class="must-like">WATCH FOR 2 MINUTES</span>
            <span class="must-like">
              👍 LIKE Video AFTER COMPLETE WATCH
            </span>
          </span>

          <div class="thumb-wrap">
            <img src="${c.thumbnailUrl}" alt="Video thumbnail" />
          </div>

          <p class="channel-name">
            YT Channel: <strong>${c.channelName}</strong>
          </p>
        </div>

        <div class="section">
          <span class="label">Instructions:</span>

          <ol class="steps">${stepsHtml}</ol>

          <div class="warning">
            ⚠ If you watch less than ${warningTime}, you will not be paid.
          </div>
        </div>

        <p class="meta">
          ${c.videoTitle} · ${fmtTime(c.videoDurationSeconds)}
        </p>
      `;
    }

    render(CONFIG);
  </script>
</body>
</html>
